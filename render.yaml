databases:
  - name: opsly-db
    databaseName: opsly
    user: opsly
    plan: free
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: opsly-app
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install --no-optional && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: opsly-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
